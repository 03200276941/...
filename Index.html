<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ID Card Guessing Game</title>
  <style>
    :root {
      --primary-color: #4361ee;
      --primary-dark: #3a56d4;
      --success-color: #4cc9f0;
      --error-color: #f72585;
      --text-color: #2b2d42;
      --light-gray: #f8f9fa;
      --white: #ffffff;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --border-radius: 12px;
      --card-border-radius: 8px;
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      background-color: var(--light-gray);
      color: var(--text-color);
      line-height: 1.6;
      background-image: radial-gradient(circle at 10% 20%, rgba(67, 97, 238, 0.05) 0%, rgba(67, 97, 238, 0.05) 90%);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
      width: 100%;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      color: var(--primary-color);
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
      position: relative;
      display: inline-block;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--success-color));
      border-radius: 2px;
    }

    .user-id-container {
      background-color: var(--white);
      padding: 1rem 2rem;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: inline-block;
      border: 2px solid rgba(67, 97, 238, 0.2);
    }

    #user-id {
      color: var(--primary-dark);
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
    }

    .cards-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 2rem;
      width: 100%;
      margin: 2rem 0;
      max-width: 1000px;
    }

    .card {
      aspect-ratio: 2/3;
      border-radius: var(--card-border-radius);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      background-color: var(--white);
      border: 1px solid rgba(0,0,0,0.05);
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      font-weight: 600;
      padding: 1rem;
      text-align: center;
      transition: var(--transition);
    }

    .placeholder::before {
      content: "?";
      font-size: 3.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
      opacity: 0.8;
    }

    #result {
      margin: 1.5rem 0;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      min-height: 2rem;
      padding: 1.2rem;
      border-radius: var(--border-radius);
      width: 100%;
      max-width: 600px;
      box-shadow: var(--shadow);
      transition: var(--transition);
      opacity: 0;
      transform: translateY(20px);
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    .success {
      background-color: rgba(76, 201, 240, 0.15);
      color: var(--success-color);
      border: 2px solid rgba(76, 201, 240, 0.3);
    }

    .error {
      background-color: rgba(247, 37, 133, 0.1);
      color: var(--error-color);
      border: 2px solid rgba(247, 37, 133, 0.2);
    }

    #restart-btn {
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
      color: var(--white);
      border-radius: 50px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
      margin-top: 1.5rem;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    #restart-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(67, 97, 238, 0.4);
    }

    #restart-btn:active {
      transform: translateY(0);
    }

    #restart-btn::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0));
      opacity: 0;
      transition: var(--transition);
    }

    #restart-btn:hover::after {
      opacity: 1;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }
      
      .cards-container {
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1.5rem;
      }
      
      .placeholder {
        font-size: 0.9rem;
      }
      
      .placeholder::before {
        font-size: 2.5rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1.5rem 0.5rem;
      }
      
      .cards-container {
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      .user-id-container {
        padding: 0.8rem 1.5rem;
      }

      #restart-btn {
        padding: 0.9rem 2rem;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ID Card Guessing Game</h1>
      <div class="user-id-container">
        <p>Your ID is: <strong><span id="user-id"></span></strong></p>
      </div>
    </header>

    <div class="cards-container" id="cards-container"></div>

    <div id="result"></div>

    <button id="restart-btn">Restart Game</button>
  </div>

  <script>
    const currentUserId = "user_123";
    document.getElementById("user-id").textContent = currentUserId;

    const cards = [
      {
        image_url: "https://t3.ftcdn.net/jpg/02/03/15/34/360_F_203153438_6tvdEUB2Nw9K0pubP6GAk7TjSIKlLorI.jpg",
        user_id: "user_456"
      },
      {
        image_url: "https://t4.ftcdn.net/jpg/05/81/62/43/360_F_581624354_jSvAOYRDCXyKfj8klz66T3u5u8UrOaiH.jpg",
        user_id: "user_123"
      },
      {
        image_url: "https://www.shutterstock.com/image-illustration/indian-flag-full-hd-wallpaper-600nw-2022311843.jpg",
        user_id: "user_789"
      },
      {
        image_url: "https://img.freepik.com/free-photo/beautiful-shot-great-wall-china_181624-34650.jpg",
        user_id: "user_101"
      }
    ];

    const cardsContainer = document.getElementById("cards-container");
    const resultDisplay = document.getElementById("result");

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function renderCards() {
      cardsContainer.innerHTML = "";
      resultDisplay.textContent = "";
      resultDisplay.className = "";
      resultDisplay.classList.remove("show");

      shuffle(cards);

      cards.forEach(card => {
        const cardElement = document.createElement("div");
        cardElement.className = "card";

        const img = document.createElement("img");
        img.src = card.image_url;

        const placeholder = document.createElement("div");
        placeholder.className = "placeholder";
        placeholder.textContent = "Click to reveal";

        cardElement.appendChild(img);
        cardElement.appendChild(placeholder);

        cardElement.addEventListener("click", () => {
          if (img.style.display === "block") return;
          
          img.style.display = "block";
          placeholder.style.display = "none";

          if (card.user_id === currentUserId) {
            resultDisplay.textContent = "🎉 You win! That was your ID card!";
            resultDisplay.classList.add("success");
          } else {
            resultDisplay.textContent = "❌ Wrong guess. Try again!";
            resultDisplay.classList.add("error");
          }
          
          resultDisplay.classList.add("show");
        });

        cardsContainer.appendChild(cardElement);
      });
    }

    document.getElementById("restart-btn").onclick = renderCards;

    renderCards();
  </script>
</body>
</html>
